<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KARYA Browser Extension</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0c0f17;
      color: #f1f5f9;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #818cf8;
      margin: 0;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(129, 140, 248, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(129, 140, 248, 0.3);
    }
    .status-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.connected { background: #34d399; box-shadow: 0 0 8px #34d399; }
    .dot.disconnected { background: #f87171; }
    .tab-info {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #e0e7ff;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover {
      background: rgba(99, 102, 241, 0.3);
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.1);
      color: #94a3b8;
    }
    button.secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #f1f5f9;
    }
    .result-box {
      margin-top: 12px;
      padding: 8px;
      background: #06080d;
      border-radius: 4px;
      font-size: 10px;
      color: #38bdf8;
      max-height: 80px;
      overflow-y: auto;
      display: none;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">KARYA Voice Agent</h1>
    <span class="badge" id="versionBadge">v1.0.0</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span style="color: #94a3b8;">Bridge Status</span>
      <div class="status-indicator">
        <span class="dot disconnected" id="statusDot"></span>
        <span id="statusText" style="color: #f87171;">Disconnected</span>
      </div>
    </div>
    <div style="font-size: 11px; color: #64748b; margin-top: 4px;">Active Tab:</div>
    <div class="tab-info" id="activeTabInfo">Loading active tab...</div>
  </div>

  <div class="btn-group">
    <button id="testConnectionBtn">Test Connection</button>
    <button id="reconnectBtn" class="secondary">Pair / Reconnect with KARYA</button>
  </div>

  <div class="result-box" id="resultBox"></div>

  <script src="popup.js"></script>
</body>
</html>
